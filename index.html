<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 Preaching Planner</title>
<style>
  :root{--ink:#172033;--muted:#64748b;--line:#cbd5e1;--panel:#fff;--bg:#f1f5f9;--head:#1e293b;--row:48px}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  button,input{font:inherit} button{cursor:pointer}.app{padding:12px;max-width:1800px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:8px}.top h1{font-size:20px;margin:0}.top p{font-size:12px;color:var(--muted);margin:2px 0 0}.notice{background:#fef3c7;padding:5px 10px;border-radius:6px;font-size:12px}
  .workspace-wrap{overflow-x:auto}.workspace{display:grid;grid-template-columns:minmax(930px,1fr) 250px 250px;gap:12px;min-width:1460px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 1px 2px #0001}.panel-head{height:32px;background:var(--head);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.add{border:0;background:#ffffff22;color:#fff;border-radius:4px;padding:1px 9px;font-size:16px}.calendar-head{display:grid;grid-template-columns:125px 215px 190px minmax(300px,1fr) 28px;gap:8px}.calendar{position:relative;display:grid;grid-template-columns:125px minmax(805px,1fr);grid-template-rows:repeat(52,var(--row))}.date-cell,.drop-cell{border-bottom:1px solid var(--line)}.date-cell{border-right:1px solid var(--line);padding:5px 8px;background:#f8fafc;font-weight:700;font-size:12px}.date-cell small{display:block;color:var(--muted);font-weight:500;font-size:10px}.date-cell.special{background:#fff1f2}.drop-cell{padding:5px 8px;color:#94a3b8;font-size:10px}.drop-cell.over{background:#dbeafe}.drop-cell.occupied{background:#f1f5f9}
  .placement{z-index:2;overflow:hidden;border-left:4px solid}.week-row{height:var(--row);display:grid;grid-template-columns:215px 190px minmax(300px,1fr) 28px;gap:8px;align-items:center;padding:0 8px}.week-row+.week-row{border-top:1px solid var(--line)}.series-label{min-width:0}.series-label b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.series-label small{color:#475569;font-size:10px}.preacher-drop{height:32px;border:1px dashed #64748b;background:#ffffffcc;border-radius:5px;display:flex;align-items:center;padding:0 7px;min-width:0;font-size:10px;color:#64748b}.preacher-drop.over{border:2px solid #2563eb;background:#eff6ff}.assigned{display:flex;align-items:center;justify-content:space-between;width:100%;gap:4px;min-width:0}.chip{background:#1e293b;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clear,.remove{border:0;background:#fff;border-radius:4px;color:#b91c1c;height:24px;min-width:24px}.subtopic{height:32px;min-width:0;border:1px solid var(--line);border-radius:5px;padding:0 8px;background:#fff}.bank{padding:8px;display:grid;gap:8px}.series-card{border-left:4px solid;padding:8px;border-radius:6px;cursor:grab}.series-card.selected,.preacher-chip.selected{outline:3px solid #2563eb;outline-offset:2px}.drop-cell.clickable,.preacher-drop.clickable{cursor:pointer}.card-line,.preacher-line{display:flex;gap:5px;align-items:flex-start}.card-main{min-width:0;flex:1}.card-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.card-main small{font-size:10px;color:#475569}.mini{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 6px;font-size:10px}.add-form{display:none;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:#f8fafc}.add-form.open{display:grid}.add-form input,.add-form select{height:32px;min-width:0;border:1px solid var(--line);border-radius:5px;padding:0 7px;background:#fff}.add-form.series-form{grid-template-columns:minmax(0,1fr) 70px 52px}.add-form.preacher-form{grid-template-columns:minmax(0,1fr) 52px}.save-add{border:0;border-radius:5px;background:#2563eb;color:#fff;font-weight:700}.preacher-chip{min-width:0;flex:1;background:#1e293b;color:#fff;padding:8px 10px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700;cursor:grab}
  .red{background:#fee2e2;border-color:#f87171}.blue{background:#dbeafe;border-color:#60a5fa}.green{background:#d1fae5;border-color:#34d399}.amber{background:#fef3c7;border-color:#fbbf24}.purple{background:#ede9fe;border-color:#a78bfa}.cyan{background:#cffafe;border-color:#22d3ee}
  @media(max-width:900px){.top{align-items:flex-start;flex-direction:column}.app{padding:8px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>2027 Preaching Planner</h1><p>Drag and drop, or click a bank item then click its destination. Changes save in this browser.</p></div><div id="notice" class="notice" hidden></div></div>
  <div class="workspace-wrap"><div class="workspace">
    <section class="panel"><div class="panel-head calendar-head"><span>Date</span><span>Series</span><span>Preacher</span><span>Subtopic</span><span></span></div><div id="calendar" class="calendar"></div></section>
    <section class="panel"><div class="panel-head"><span>Series bank</span><button class="add" id="addSeries" type="button" title="Add series">+</button></div><form id="seriesForm" class="add-form series-form"><input id="seriesTitle" required maxlength="80" placeholder="Series title"><select id="seriesWeeks" aria-label="Weeks"><option value="1">1 wk</option><option value="2">2 wks</option><option value="3">3 wks</option><option value="4">4 wks</option><option value="5">5 wks</option><option value="6">6 wks</option></select><button class="save-add" type="submit">Add</button></form><div id="seriesBank" class="bank"></div></section>
    <section class="panel"><div class="panel-head"><span>Preacher bank</span><button class="add" id="addPreacher" type="button" title="Add preacher">+</button></div><form id="preacherForm" class="add-form preacher-form"><input id="preacherName" required maxlength="60" placeholder="Preacher name"><button class="save-add" type="submit">Add</button></form><div id="preacherBank" class="bank"></div></section>
  </div></div>
</div>
<script>
const colours=['red','blue','green','amber','purple','cyan'];
const defaults={series:[
{id:'joke',title:'Christianity is a Joke',weeks:2,colour:'red'},
{id:'read',title:'How to Read the Bible',weeks:6,colour:'blue'},
{id:'do',title:'How to Do the Bible',weeks:4,colour:'green'},
{id:'work',title:'Theology of Work',weeks:4,colour:'amber'},
{id:'dark',title:'OT After Dark',weeks:6,colour:'purple'},
{id:'trinity',title:'The Trinity',weeks:4,colour:'cyan'}],preachers:['Caitlin','Jean','Christine','David','Guest Preacher','Denise'],placements:[{id:'test-trinity',seriesId:'trinity',start:44,weeks:4,details:[{preacher:'Caitlin',subtopic:'Models of the Trinity'},{preacher:'',subtopic:'Father/Lover'},{preacher:'David',subtopic:'Son/Beloved'},{preacher:'Caitlin',subtopic:'Holy Spirit/Love'}]}]};
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};
let series=load('planner-test-series-v2',defaults.series),preachers=load('planner-test-preachers-v2',defaults.preachers),placements=load('planner-test-placements-v2',[]);
const save=()=>{localStorage.setItem('planner-test-series-v2',JSON.stringify(series));localStorage.setItem('planner-test-preachers-v2',JSON.stringify(preachers));localStorage.setItem('planner-test-placements-v2',JSON.stringify(placements))};
const sundays=[]; for(let d=new Date(2027,0,3);d.getFullYear()===2027;d.setDate(d.getDate()+7)){sundays.push({id:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,full:d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}),short:d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})})}
const special={'2027-03-28':'Easter','2027-12-19':'Christmas','2027-12-26':'Christmas'};
const notice=t=>{const n=document.querySelector('#notice');n.textContent=t;n.hidden=!t};
let selected=null;
const dragData=(e,data)=>{selected=data;e.dataTransfer.effectAllowed='copyMove';const value=JSON.stringify(data);e.dataTransfer.setData('text/plain',value);try{e.dataTransfer.setData('application/json',value)}catch{}};
const readDrag=e=>{for(const type of ['text/plain','application/json']){try{const value=e.dataTransfer.getData(type);if(value)return JSON.parse(value)}catch{}}return selected};
const choose=data=>{selected=data;notice(data.kind==='series'?'Series selected: click a Sunday to place it.':'Preacher selected: click a preacher cell to assign it.');render()};
function overlaps(start,weeks,ignore=''){const end=start+weeks-1;return placements.some(p=>p.id!==ignore&&start<=p.start+p.weeks-1&&end>=p.start)}
function placeSeries(data,start){const s=series.find(x=>x.id===data.seriesId);if(!s)return;if(start+s.weeks>sundays.length)return notice('This series does not fit before the end of 2027.');if(overlaps(start,s.weeks,data.placementId||''))return notice('That range overlaps another series.');if(data.placementId){placements=placements.map(p=>p.id===data.placementId?{...p,start}:p)}else{placements.push({id:'p'+Date.now(),seriesId:s.id,start,weeks:s.weeks,details:Array.from({length:s.weeks},()=>({preacher:'',subtopic:''}))})}notice('');save();render()}
function render(){renderCalendar();renderSeries();renderPreachers()}
function renderCalendar(){const c=document.querySelector('#calendar');c.innerHTML='';sundays.forEach((s,i)=>{const date=document.createElement('div');date.className='date-cell'+(special[s.id]?' special':'');date.style.gridColumn='1';date.style.gridRow=String(i+1);date.innerHTML=`${s.full}<small>W${i+1}${special[s.id]?' · '+special[s.id]:''}</small>`;c.append(date);const occupied=placements.some(p=>i>=p.start&&i<p.start+p.weeks);const drop=document.createElement('div');drop.className='drop-cell'+(occupied?' occupied':'');drop.style.gridColumn='2';drop.style.gridRow=String(i+1);drop.textContent=occupied?'':'Drop series';drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');const d=readDrag(e);if(d?.kind==='series'){placeSeries(d,i);selected=null}};drop.onclick=()=>{if(selected?.kind==='series'){placeSeries(selected,i);selected=null}};if(!occupied)drop.classList.add('clickable');c.append(drop)});
placements.forEach(p=>{const s=series.find(x=>x.id===p.seriesId);if(!s)return;const block=document.createElement('div');block.className=`placement ${s.colour}`;block.style.gridColumn='2';block.style.gridRow=`${p.start+1} / span ${p.weeks}`;block.draggable=true;block.ondragstart=e=>dragData(e,{kind:'series',seriesId:s.id,placementId:p.id});p.details.forEach((d,w)=>{const row=document.createElement('div');row.className='week-row';row.innerHTML=`<div class="series-label"><b title="${s.title.replaceAll('"','&quot;')}">${s.title}</b><small>${w+1}/${p.weeks} · ${sundays[p.start+w].short}</small></div><div class="preacher-drop"><span>${d.preacher?`<span class="chip">${d.preacher}</span>`:'Drop preacher'}</span>${d.preacher?'<button class="clear">×</button>':''}</div><input class="subtopic" placeholder="Subtopic" value="${d.subtopic.replaceAll('"','&quot;')}">${w===0?'<button class="remove" title="Remove series">×</button>':'<span></span>'}`;
const pd=row.querySelector('.preacher-drop');pd.ondragover=e=>{e.preventDefault();e.stopPropagation();pd.classList.add('over')};pd.ondragleave=()=>pd.classList.remove('over');pd.ondrop=e=>{e.preventDefault();e.stopPropagation();pd.classList.remove('over');const x=readDrag(e);if(x?.kind==='preacher'){d.preacher=x.name;selected=null;notice('');save();render()}};pd.onclick=()=>{if(selected?.kind==='preacher'){d.preacher=selected.name;selected=null;notice('');save();render()}};pd.classList.add('clickable');row.querySelector('.clear')?.addEventListener('click',()=>{d.preacher='';save();render()});row.querySelector('.subtopic').addEventListener('input',e=>{d.subtopic=e.target.value;save()});row.querySelector('.remove')?.addEventListener('click',()=>{placements=placements.filter(x=>x.id!==p.id);save();render()});block.append(row)});c.append(block)})}
function renderSeries(){const b=document.querySelector('#seriesBank');b.innerHTML='';series.forEach(s=>{const card=document.createElement('div');card.className=`series-card ${s.colour}`;card.draggable=true;const seriesData={kind:'series',seriesId:s.id};card.ondragstart=e=>dragData(e,seriesData);card.onclick=e=>{if(!e.target.closest('button'))choose(seriesData)};if(selected?.kind==='series'&&selected.seriesId===s.id)card.classList.add('selected');card.innerHTML=`<div class="card-line"><div class="card-main"><b title="${s.title.replaceAll('"','&quot;')}">${s.title}</b><small>${s.weeks} week${s.weeks===1?'':'s'}</small></div><button type="button" draggable="false" class="mini edit">Edit</button><button type="button" draggable="false" class="mini del">×</button></div>`;card.querySelector('.edit').onclick=()=>{const title=prompt('Series title',s.title);if(!title?.trim())return;const weeks=Number(prompt('Number of weeks (1–6)',s.weeks));if(!Number.isInteger(weeks)||weeks<1||weeks>6)return notice('Series length must be 1–6 weeks.');s.title=title.trim();s.weeks=weeks;save();render()};card.querySelector('.del').onclick=()=>{series=series.filter(x=>x.id!==s.id);placements=placements.filter(x=>x.seriesId!==s.id);save();render()};b.append(card)})}
function renderPreachers(){const b=document.querySelector('#preacherBank');b.innerHTML='';preachers.forEach(name=>{const line=document.createElement('div');line.className='preacher-line';line.innerHTML=`<div class="preacher-chip">${name}</div><button type="button" draggable="false" class="mini edit">Edit</button><button type="button" draggable="false" class="mini del">×</button>`;const chip=line.querySelector('.preacher-chip');const preacherData={kind:'preacher',name};chip.draggable=true;chip.ondragstart=e=>dragData(e,preacherData);chip.onclick=()=>choose(preacherData);if(selected?.kind==='preacher'&&selected.name===name)chip.classList.add('selected');line.querySelector('.edit').onclick=()=>{const n=prompt('Preacher name',name)?.trim();if(!n||preachers.includes(n)&&n!==name)return;preachers=preachers.map(x=>x===name?n:x);placements.forEach(p=>p.details.forEach(d=>{if(d.preacher===name)d.preacher=n}));save();render()};line.querySelector('.del').onclick=()=>{preachers=preachers.filter(x=>x!==name);placements.forEach(p=>p.details.forEach(d=>{if(d.preacher===name)d.preacher=''}));save();render()};b.append(line)})}
const seriesForm=document.querySelector('#seriesForm');
const preacherForm=document.querySelector('#preacherForm');
document.querySelector('#addSeries').onclick=()=>{seriesForm.classList.toggle('open');if(seriesForm.classList.contains('open'))document.querySelector('#seriesTitle').focus()};
document.querySelector('#addPreacher').onclick=()=>{preacherForm.classList.toggle('open');if(preacherForm.classList.contains('open'))document.querySelector('#preacherName').focus()};
seriesForm.addEventListener('submit',e=>{e.preventDefault();const title=document.querySelector('#seriesTitle').value.trim();const weeks=Number(document.querySelector('#seriesWeeks').value);if(!title)return notice('Enter a series title.');series.push({id:'s'+Date.now(),title,weeks,colour:colours[series.length%colours.length]});document.querySelector('#seriesTitle').value='';document.querySelector('#seriesWeeks').value='1';seriesForm.classList.remove('open');notice('');save();render()});
preacherForm.addEventListener('submit',e=>{e.preventDefault();const input=document.querySelector('#preacherName');const name=input.value.trim();if(!name)return notice('Enter a preacher name.');if(preachers.includes(name))return notice('That preacher is already in the bank.');preachers.push(name);input.value='';preacherForm.classList.remove('open');notice('');save();render()});
render();
if(!document.querySelector('#calendar')||!document.querySelector('#seriesBank')||!document.querySelector('#preacherBank'))notice('Planner failed to initialise.');
</script>
</body>
</html>
